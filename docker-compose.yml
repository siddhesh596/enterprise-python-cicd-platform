version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: postgres-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enterprise_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  api:
  image: 571850512217.dkr.ecr.ap-south-1.amazonaws.com/enterprise-python-api:latest

  container_name: enterprise-python-api

  ports:
    - "8000:8000"

  environment:
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/enterprise_db

  depends_on:
    postgres:
      condition: service_healthy

  restart: always

    container_name: enterprise-python-api

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/enterprise_db

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

volumes:
  postgres_data: